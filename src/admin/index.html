<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Vilma</title>
  <!-- Tema aplicado antes do CSS para não piscar claro -> escuro -->
  <script>
    try { const t = localStorage.getItem('painelTema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--
    Pasta do painel. O mesmo arquivo é aberto por endereços diferentes:
      /config, /painel, /admin  (Express e Vercel)  -> arquivos em /admin/
      /src/admin/index.html     (Live Server)       -> a pasta do próprio arquivo
    Caminho relativo não serve (em /config ele cairia em /css, que é do site),
    e <base> quebraria os links "#tela" do trilho. Por isso a pasta é calculada.
  -->
  <script>
    window.PAINEL_BASE = /\/admin\/(index\.html)?$/.test(location.pathname)
      ? location.pathname.replace(/index\.html$/, '')
      : '/admin/';
    for (const folha of ['painel', 'meu-site', 'inicio']) {
      document.write('<link rel="stylesheet" href="' + PAINEL_BASE + 'css/' + folha + '.css">');
    }
  </script>
</head>

<body class="auth-locked">

  <!-- ====== Sprite de ícones (use href="#i-xxx") ====== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 606.85 340.47">
        <polygon fill="currentColor" points="158.98 263.55 158.38 263.55 158.52 263.29 44.15 262.88 0 338.23 116.87 338.83 158.98 263.55" />

      </symbol>
      <symbol id="i-inicio" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="4"/><rect x="13" y="3" width="8" height="8" rx="4"/><rect x="3" y="13" width="8" height="8" rx="4"/><rect x="13" y="13" width="8" height="8" rx="4"/></g></symbol>
      <symbol id="i-agenda" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="8" cy="14.5" r=".6" fill="currentColor"/><circle cx="12" cy="14.5" r=".6" fill="currentColor"/><circle cx="16" cy="14.5" r=".6" fill="currentColor"/><circle cx="8" cy="18" r=".6" fill="currentColor"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></g></symbol>
      <symbol id="i-clientes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.6 3.1 2.3 3.5 5.2"/></g></symbol>
      <symbol id="i-selecao" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="9.5" r="1.8"/><path d="m21 15-4.5-4.5L7 20"/></g></symbol>
      <symbol id="i-site" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="M2.5 9h19"/><circle cx="6" cy="6.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="6.5" r=".5" fill="currentColor"/><path d="m10 17 1-3 4.5-4.5 2 2L13 16z"/></g></symbol>
      <symbol id="i-financeiro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h3"/></g></symbol>
      <symbol id="i-insights" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g></symbol>
      <symbol id="i-mensagens" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20.5l1.4-5A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></g></symbol>
      <symbol id="i-notificacoes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></g></symbol>
      <symbol id="i-ajustes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></g></symbol>
      <symbol id="i-sair" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h3a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-3"/><path d="M9 8l-4 4 4 4M5 12h10"/></g></symbol>
      <symbol id="i-busca" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></symbol>
      <symbol id="i-usuario" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c.6-4 3.8-6 8-6s7.4 2 8 6z"/></g></symbol>
      <symbol id="i-seta" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-lua" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
      <symbol id="i-sol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></symbol>
      <symbol id="i-externo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></g></symbol>
    </defs>
  </svg>

  <div class="app">

    <!-- ====== Trilho lateral ====== -->
    <aside class="rail" aria-label="Navegação do painel">
      <a class="rail-logo" href="#inicio" aria-label="Início">
        <svg><use href="#i-logo" /></svg>
      </a>

      <!-- Os itens são gerados a partir de TELAS em js/painel.js -->
      <nav class="rail-nav" id="rail-nav"></nav>

      <button class="rail-btn rail-sair" id="btn-sair" type="button" data-rotulo="Sair">
        <svg><use href="#i-sair" /></svg>
        <span class="sr-only">Sair</span>
      </button>
    </aside>

    <!-- ====== Área principal ====== -->
    <main class="palco">
      <header class="topo">
        <div class="saudacao">
          <img class="avatar" id="avatar" alt="">
          <div>
            <h1 id="saudacao-titulo">Olá, Vilma! 👋</h1>
            <p id="saudacao-sub">Comece o seu dia por aqui</p>
          </div>
        </div>

        <label class="busca">
          <svg><use href="#i-busca" /></svg>
          <input type="search" placeholder="Buscar" aria-label="Buscar">
        </label>

        <div class="topo-acoes">
          <button class="icone-btn" id="btn-tema" type="button" aria-label="Alternar tema">
            <svg class="so-claro"><use href="#i-lua" /></svg>
            <svg class="so-escuro"><use href="#i-sol" /></svg>
          </button>
          <a class="icone-btn" href="/" target="_blank" rel="noopener" aria-label="Abrir o site">
            <svg><use href="#i-externo" /></svg>
          </a>
          <button class="conta-btn" type="button">
            <svg><use href="#i-usuario" /></svg>
            Minha conta
            <svg class="seta"><use href="#i-seta" /></svg>
          </button>
        </div>
      </header>

      <!-- Cada tela é uma <section data-tela="id">. Só uma fica ativa por vez. -->
      <div class="telas" id="telas"></div>
    </main>
  </div>

  <script>
    const entrada = document.createElement('script');
    entrada.type = 'module';
    entrada.src = PAINEL_BASE + 'js/painel.js';
    document.body.appendChild(entrada);
  </script>
</body>

</html>
