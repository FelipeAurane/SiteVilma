  <!--
    Pasta do painel. O mesmo arquivo é aberto por endereços diferentes:
      /config, /painel, /admin  (Express e Vercel)  -> arquivos em /admin/
      /src/admin/index.html     (Live Server)       -> a pasta do próprio arquivo
    Caminho relativo não serve (em /config ele cairia em /css, que é do site),
    e <base> quebraria os links "#tela" do trilho. Por isso a pasta é calculada.
  -->
  <script>
    window.PAINEL_BASE = /\/admin\/(index\.html)?$/.test(location.pathname)
      ? location.pathname.replace(/index\.html$/, '')
      : '/admin/';
    for (const folha of ['painel', 'meu-site', 'inicio']) {
      document.write('<link rel="stylesheet" href="' + PAINEL_BASE + 'css/' + folha + '.css">');
    }
  </script>

  <!-- ====== Barra da janela (só no app desktop, que abre sem a barra do Windows) ====== -->
  <header class="barra-app" id="barra-app" hidden>
    <div class="barra-marca">
      <svg><use href="#i-luvi" /></svg>
      <span class="barra-nome">Luvi</span>
      <span class="barra-tela" id="barra-tela"></span>
      <span class="barra-servidor" id="barra-servidor" hidden></span>
    </div>
    <div class="barra-botoes">
      <button type="button" data-janela="minimizar" aria-label="Minimizar">
        <svg viewBox="0 0 12 12"><path d="M2 6.5h8" /></svg>
      </button>
      <button type="button" data-janela="maximizar" aria-label="Maximizar">
        <svg class="ico-maximizar" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" /></svg>
        <svg class="ico-restaurar" viewBox="0 0 12 12"><rect x="2" y="3.8" width="6.2" height="6.2" rx="1.2" /><path d="M4 2.2h4.6A1.4 1.4 0 0 1 10 3.6v4.6" /></svg>
      </button>
      <button type="button" data-janela="fechar" class="barra-fechar" aria-label="Fechar">
        <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
      </button>
    </div>
  </header>

  <div class="app">

    <!-- ====== Trilho lateral ====== -->
    <aside class="rail" aria-label="Navegação do painel">
      <a class="rail-logo" href="#inicio" aria-label="Luvi — Início">
        <svg><use href="#i-luvi" /></svg>
      </a>

      <!-- Os itens são gerados a partir de TELAS em js/painel.js -->
      <nav class="rail-nav" id="rail-nav"></nav>

      <!-- Fica no trilho para valer em todas as telas (o topo só aparece no Início) -->
      <button class="rail-btn rail-tema" id="btn-tema" type="button" data-rotulo="Tema claro / escuro" aria-label="Alternar tema">
        <svg class="so-claro"><use href="#i-lua" /></svg>
        <svg class="so-escuro"><use href="#i-sol" /></svg>
      </button>

      <button class="rail-btn rail-sair" id="btn-sair" type="button" data-rotulo="Sair">
        <svg><use href="#i-sair" /></svg>
        <span class="sr-only">Sair</span>
      </button>
    </aside>

    <!-- ====== Área principal ====== -->
    <main class="palco">
      <header class="topo">
        <div class="saudacao">
          <img class="avatar" id="avatar" alt="">
          <div>
            <h1 id="saudacao-titulo">Olá, Vilma! 👋</h1>
            <p id="saudacao-sub">Comece o seu dia por aqui</p>
          </div>
        </div>

        <label class="busca">
          <svg><use href="#i-busca" /></svg>
          <input type="search" placeholder="Buscar" aria-label="Buscar">
        </label>

        <div class="topo-acoes">
          <a class="icone-btn" href="/" target="_blank" rel="noopener" aria-label="Abrir o site">
            <svg><use href="#i-externo" /></svg>
          </a>
          <button class="conta-btn" type="button">
            <svg><use href="#i-usuario" /></svg>
            Minha conta
            <svg class="seta"><use href="#i-seta" /></svg>
          </button>
        </div>
      </header>

      <!-- Cada tela é uma <section data-tela="id">. Só uma fica ativa por vez. -->
      <div class="telas" id="telas"></div>
    </main>
  </div>

  <script>
    const entrada = document.createElement('script');
    entrada.type = 'module';
    entrada.src = PAINEL_BASE + 'js/painel.js';
    document.body.appendChild(entrada);
  </script>
</body>

</html>
