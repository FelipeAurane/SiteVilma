<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download das fotos</title>
  <link rel="stylesheet" href="../css/selecao-cliente.css">
  <style>
    body { margin:0; background:#0e0e10; color:#fff; font-family: system-ui, sans-serif; overflow:hidden; }
    .dl-stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    .dl-slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition: transform .4s ease; }
    .dl-slide img { max-width:100%; max-height:100%; object-fit:contain; }
    .dl-bar { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:10; }
    .dl-bar button { padding:10px 18px; border-radius:999px; border:0; background:#7F8C7A; color:#fff; font-size:14px; }
  </style>
</head>
<body>
  <div id="login" class="sc-mensagem">
    <h1>Download das fotos</h1>
    <p>Entre com o e-mail e a senha recebidos.</p>
    <form id="form-login">
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="erro" style="color:#fca5a5"></p>
  </div>
  <div id="app" style="display:none">
    <div class="dl-stage" id="stage"></div>
    <div class="dl-bar">
      <button id="btn-baixar">Baixar foto</button>
      <button id="btn-pausar">Pausar</button>
    </div>
  </div>
  <script src="../js/download-cliente.js" defer></script>
</body>
</html>
