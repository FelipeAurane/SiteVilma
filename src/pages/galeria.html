<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description"
    content="Galeria de fotografias gastronômicas da Vilma Silva estilo Pinterest. Imagens que valorizam o seu produto.">
  <meta name="theme-color" content="#0e0e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/img/icon-192.png">

  <title>Galeria — Vilma Silva Fotografia</title>
  <link rel="stylesheet" href="../css/pagina.css">

  <style>
    /* Galeria estilo Pinterest: apenas Botão Voltar, Nome da Galeria e Mosaico Masonry de Imagens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0e0e10;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Barra Superior com Botão Voltar e Nome da Galeria */
    .gallery-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14, 14, 16, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .btn-voltar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border-radius: 50%;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.22s ease;
      flex-shrink: 0;
    }

    .btn-voltar:hover {
      background: rgba(224, 171, 171, 0.2);
      border-color: var(--rosa, #e0abab);
      color: var(--rosa, #e0abab);
      transform: translateX(-3px);
    }

    .btn-voltar svg {
      width: 22px;
      height: 22px;
      transition: transform 0.2s ease;
    }

    .btn-voltar:hover svg {
      transform: translateX(-2px);
    }

    .gallery-title-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .gallery-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      margin: 0;
      text-transform: capitalize;
      line-height: 1.2;
    }

    .gallery-topbar-spacer {
      width: 44px;
      flex-shrink: 0;
    }

    /* Conteúdo Principal — Mosaico Estilo Pinterest (Masonry Multi-colunas) */
    .gallery-main {
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* Mosaico estilo Pinterest com colunas CSS sem corte de altura */
    .pinterest-masonry {
      column-count: 4;
      column-gap: 16px;
      width: 100%;
    }

    @media (max-width: 1200px) {
      .pinterest-masonry {
        column-count: 3;
        column-gap: 14px;
      }
    }

    @media (max-width: 768px) {
      .gallery-topbar {
        padding: 12px 14px;
      }
      .gallery-title {
        font-size: 18px;
      }
      .btn-voltar {
        width: 40px;
        height: 40px;
      }
      .gallery-topbar-spacer {
        width: 40px;
      }
      .gallery-main {
        padding: 16px 10px 40px;
      }
      .pinterest-masonry {
        column-count: 2;
        column-gap: 10px;
      }
    }

    /* Pin estilo Pinterest */
    .pinterest-pin {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 16px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #17171a;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease, border-color 0.28s ease;
      display: inline-block;
      width: 100%;
    }

    .pinterest-pin:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
      border-color: rgba(224, 171, 171, 0.4);
    }

    /* Imagem no seu aspect-ratio natural, característico do Pinterest */
    .pinterest-pin img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
      background: #1c1c20;
    }

    .pinterest-pin:hover img {
      transform: scale(1.035);
    }

    /* Lightbox Modal para ampliar a imagem ao clicar */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6, 6, 9, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox-dialog {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      color: #ffffff;
      font-size: 28px;
      cursor: pointer;
      z-index: 10002;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
      outline: none;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, .25);
      transform: scale(1.08);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
      z-index: 10001;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, .25);
      transform: translateY(-50%) scale(1.08);
    }

    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }

    .lightbox-content {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 90vw;
      max-height: 80vh;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.2s ease;
    }

    .lightbox-counter {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, .9);
      background: rgba(0, 0, 0, .6);
      padding: 8px 22px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
      z-index: 10001;
    }

    @media (max-width: 768px) {
      .lightbox-nav {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
      .lightbox-close {
        top: 12px;
        right: 12px;
        width: 38px;
        height: 38px;
      }
      .lightbox-counter {
        bottom: 16px;
      }
    }
  </style>
</head>

<body>
  <!-- Barra superior: apenas Botão de Voltar e Nome da Galeria -->
  <header class="gallery-topbar">
    <a href="../index.html#portfolio" class="btn-voltar" id="btn-voltar" aria-label="Voltar para o portfólio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 19l-7-7 7-7" />
      </svg>
    </a>

    <div class="gallery-title-wrap">
      <h1 class="gallery-title" id="gallery-title">Gastronomia</h1>
    </div>

    <div class="gallery-topbar-spacer" aria-hidden="true"></div>
  </header>

  <!-- Conteúdo: apenas as imagens da galeria estilo Pinterest (Masonry) -->
  <main class="gallery-main">
    <div class="pinterest-masonry" id="gallery-container" aria-live="polite">
      <!-- Pins inseridos dinamicamente -->
    </div>
  </main>

  <!-- Visualizador ampliado (Lightbox) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotos">
    <div class="lightbox-dialog" id="lightbox-dialog">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Fechar">&times;</button>
      <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">&#10094;</button>

      <div class="lightbox-content">
        <img id="lightbox-img" src="" alt="Foto em alta resolução">
      </div>

      <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Próxima">&#10095;</button>

      <div class="lightbox-counter" id="lightbox-counter">1 de 1</div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      var CATEGORIAS_PADRAO = {
        'Gastronomia': [
          '../img/p-4.JPG',
          '../img/p-massa.jpg',
          '../img/capa.jpg',
          '../img/p-steak.jpg',
          '../img/p-3.JPG',
          '../img/img1.jpg',
          '../img/p-5.jpg',
          '../img/p-burger.jpg',
          '../img/p-pizza.jpg'
        ],
        'Confeitaria': [
          '../img/p-6.JPG',
          '../img/p-2.JPG',
          '../img/p-sobremesa.jpg',
          '../img/p-cafe.jpg',
          '../img/capa.jpg',
          '../img/p-4.JPG',
          '../img/p-drink.jpg'
        ],
        'Hambúrgueres': [
          '../img/p-burger.jpg',
          '../img/p-steak.jpg',
          '../img/p-4.JPG',
          '../img/img1.jpg',
          '../img/p-7.jpg',
          '../img/p-pizza.jpg',
          '../img/p-3.JPG'
        ],
        'Pizzas': [
          '../img/p-pizza.jpg',
          '../img/p-massa.jpg',
          '../img/p-4.JPG',
          '../img/p-steak.jpg',
          '../img/p-3.JPG',
          '../img/p-burger.jpg'
        ],
        'Bebidas': [
          '../img/p-7.jpg',
          '../img/p-drink.jpg',
          '../img/p-cafe.jpg',
          '../img/p-4.JPG',
          '../img/p-sobremesa.jpg',
          '../img/capa.jpg',
          '../img/p-6.JPG'
        ],
        'Restaurantes': [
          '../img/p-3.JPG',
          '../img/p-steak.jpg',
          '../img/img1.jpg',
          '../img/p-4.JPG',
          '../img/p-massa.jpg',
          '../img/capa.jpg',
          '../img/vilma.jpg'
        ],
        'Alta Gastronomia': [
          '../img/p-5.jpg',
          '../img/p-massa.jpg',
          '../img/p-sobremesa.jpg',
          '../img/p-steak.jpg',
          '../img/p-4.JPG',
          '../img/p-3.JPG',
          '../img/capa.jpg'
        ],
        'Cardápios': [
          '../img/img1.jpg',
          '../img/p-burger.jpg',
          '../img/p-pizza.jpg',
          '../img/p-steak.jpg',
          '../img/p-massa.jpg',
          '../img/p-4.JPG'
        ],
        'Vilma Silva': [
          '../img/vilma.jpg',
          '../img/capa.jpg',
          '../img/p-4.JPG',
          '../img/p-massa.jpg'
        ]
      };

      var container = document.getElementById('gallery-container');
      var titleEl = document.getElementById('gallery-title');
      var btnVoltar = document.getElementById('btn-voltar');
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightbox-img');
      var lightboxClose = document.getElementById('lightbox-close');
      var lightboxPrev = document.getElementById('lightbox-prev');
      var lightboxNext = document.getElementById('lightbox-next');
      var lightboxCounter = document.getElementById('lightbox-counter');

      var currentImages = [];
      var currentLightboxIndex = 0;

      function normalizarCaminho(src) {
        if (!src) return '';
        var limpo = src.trim();
        if (limpo.startsWith('./img/')) return '../img/' + limpo.substring(6);
        if (limpo.startsWith('img/')) return '../img/' + limpo.substring(4);
        if (limpo.startsWith('/img/')) return '../img/' + limpo.substring(5);
        return limpo;
      }

      function normalizarTexto(txt) {
        if (!txt) return '';
        return txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      function obterParametroCategoria() {
        try {
          var params = new URLSearchParams(window.location.search);
          var cat = params.get('category');
          if (cat && cat.trim()) return cat.trim();
        } catch (e) {}
        return null;
      }

      function carregarDadosCategoria(nome) {
        var fotos = [];
        var nomeNormal = normalizarTexto(nome);

        // 1. Tenta cache imediato de clique
        try {
          var saved = JSON.parse(localStorage.getItem('current_gallery_data') || 'null');
          if (saved && saved.name && normalizarTexto(saved.name) === nomeNormal) {
            if (Array.isArray(saved.gallery) && saved.gallery.length > 0) {
              fotos = saved.gallery.map(normalizarCaminho);
            }
          }
        } catch (e) {}

        // 2. Tenta cache global de conteúdo
        if (fotos.length === 0) {
          try {
            var cachedAll = JSON.parse(localStorage.getItem('vilma_fotografia_data') || 'null');
            if (cachedAll && Array.isArray(cachedAll.categories)) {
              var found = cachedAll.categories.find(function(c) {
                return c.name && normalizarTexto(c.name) === nomeNormal;
              });
              if (found) {
                if (Array.isArray(found.gallery) && found.gallery.length > 0) {
                  fotos = found.gallery.map(normalizarCaminho);
                } else if (found.image) {
                  fotos = [normalizarCaminho(found.image)];
                }
              }
            }
          } catch (e) {}
        }

        // 3. Fallback no catálogo interno
        if (fotos.length === 0) {
          var match = null;
          var chaves = Object.keys(CATEGORIAS_PADRAO);
          for (var i = 0; i < chaves.length; i++) {
            if (normalizarTexto(chaves[i]) === nomeNormal) {
              match = CATEGORIAS_PADRAO[chaves[i]];
              nome = chaves[i];
              break;
            }
          }
          if (match) {
            fotos = match.slice();
          } else {
            fotos = CATEGORIAS_PADRAO['Gastronomia'].slice();
          }
        }

        return {
          name: nome,
          images: fotos
        };
      }

      function renderizarGaleria(dados) {
        currentImages = dados.images;

        document.title = dados.name + ' — Galeria Vilma Silva';
        if (titleEl) titleEl.textContent = dados.name;

        if (!container) return;
        container.innerHTML = '';

        currentImages.forEach(function(src, index) {
          var pin = document.createElement('div');
          pin.className = 'pinterest-pin';
          pin.setAttribute('role', 'button');
          pin.setAttribute('tabindex', '0');
          pin.setAttribute('aria-label', 'Ver foto ' + (index + 1) + ' de ' + dados.name);

          var img = document.createElement('img');
          img.src = src;
          img.alt = dados.name + ' - Foto ' + (index + 1);
          img.loading = index < 6 ? 'eager' : 'lazy';

          pin.appendChild(img);

          pin.addEventListener('click', function() {
            abrirLightbox(index);
          });
          pin.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              abrirLightbox(index);
            }
          });

          container.appendChild(pin);
        });
      }

      function abrirLightbox(index) {
        if (!currentImages || currentImages.length === 0) return;
        currentLightboxIndex = (index + currentImages.length) % currentImages.length;

        var src = currentImages[currentLightboxIndex];
        if (lightboxImg) {
          lightboxImg.style.opacity = '0';
          lightboxImg.src = src;
          lightboxImg.onload = function() {
            lightboxImg.style.opacity = '1';
          };
        }

        if (lightboxCounter) {
          lightboxCounter.textContent = (currentLightboxIndex + 1) + ' de ' + currentImages.length;
        }

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function fecharLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }

      function lightboxNav(direcao) {
        abrirLightbox(currentLightboxIndex + direcao);
      }

      if (lightboxClose) lightboxClose.addEventListener('click', fecharLightbox);
      if (lightboxPrev) lightboxPrev.addEventListener('click', function(e) { e.stopPropagation(); lightboxNav(-1); });
      if (lightboxNext) lightboxNext.addEventListener('click', function(e) { e.stopPropagation(); lightboxNav(1); });

      if (lightbox) {
        lightbox.addEventListener('click', function(e) {
          if (e.target === lightbox || e.target.id === 'lightbox-dialog' || e.target.classList.contains('lightbox-content')) {
            fecharLightbox();
          }
        });
      }

      document.addEventListener('keydown', function(e) {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') fecharLightbox();
        else if (e.key === 'ArrowLeft') lightboxNav(-1);
        else if (e.key === 'ArrowRight') lightboxNav(1);
      });

      // Suporte a swipe no celular
      var touchStartX = 0;
      var touchEndX = 0;
      if (lightbox) {
        lightbox.addEventListener('touchstart', function(e) {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        lightbox.addEventListener('touchend', function(e) {
          touchEndX = e.changedTouches[0].screenX;
          var diff = touchStartX - touchEndX;
          if (Math.abs(diff) > 45) {
            if (diff > 0) lightboxNav(1);
            else lightboxNav(-1);
          }
        }, { passive: true });
      }

      // Botão voltar com histórico inteligente: retorna ao portfólio de onde veio
      if (btnVoltar) {
        btnVoltar.addEventListener('click', function(e) {
          e.preventDefault();
          if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
            window.history.back();
          } else {
            window.location.href = '../index.html#portfolio';
          }
        });
      }

      // Inicialização imediata
      var catInicial = obterParametroCategoria() || 'Gastronomia';
      var dadosIniciais = carregarDadosCategoria(catInicial);
      renderizarGaleria(dadosIniciais);
    })();
  </script>
</body>

</html>
